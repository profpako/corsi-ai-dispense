    @media(max-width:760px){header{padding-top:18px;padding-bottom:18px}.offline{max-width:100px;font-size:12px}.brand{font-size:17px}main{padding-top:30px}.intro{grid-template-columns:1fr;gap:15px;margin-bottom:20px}.goal{padding:18px 0 0;border-left:0;border-top:1px solid var(--line)}.goal ol{display:flex;flex-wrap:wrap;gap:6px 28px}.goal p{margin-bottom:8px}.workspace{grid-template-columns:1fr}aside{position:static}.challenge{margin-top:5px}.challenge ul{columns:2;column-gap:30px}.recipes{margin-bottom:22px}.recipes button{padding:13px 10px;font-size:14px}.recipes span{font-size:12px}.sheet-title{display:block}.tag{display:inline-block;margin-bottom:16px}.finish{align-items:start;flex-direction:column}.sheet{padding:20px}.results-header{align-items:start;flex-direction:column;gap:0}.sheet-title h2,h2{font-size:28px}}
    @media(max-width:430px){header,main,footer{padding-left:16px;padding-right:16px}.ingredient{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ingredient input{padding:8px;font-size:16px}.settings{grid-template-columns:1fr;gap:15px}.sheet{padding:16px}.recipes button{font-size:13px;padding:12px 8px}.challenge ul{columns:1}.metrics{gap:16px}.metric strong{font-size:24px}footer{flex-direction:column;gap:5px}.sheet-title h2{font-size:26px}.goal ol{display:block}}

<body>
<!-- =====================================================================
 AREA DOCENTE — INIZIO
 Tutti i testi e le etichette sono nel template seguente e in DIDATTICA.
 Dati, vincoli, suggerimenti, esempio e soluzioni sono in DIDATTICA.
 Le soluzioni sono riservate al docente nel codice: non appaiono nell'app.
 Modificare soltanto quest'area per personalizzare l'attività.
 Unità: g serviti per porzione; prezzi €/kg; scarto e resa in percentuale.
====================================================================== -->
<template id="interfaccia-docente">
  <a class="skip" href="#laboratorio">Vai al laboratorio</a>
  <header><div class="brand">Cucina <span>×</span> Matematica</div><div class="offline">Laboratorio offline</div></header>
  <main>
    <div class="intro">
      <div><h1>Dalla ricetta al costo della porzione.</h1><p class="muted">Una buona ricetta si progetta anche con i numeri. Sperimenta con tre piatti, scopri il costo degli ingredienti e trova il tuo equilibrio tra porzione e budget.</p></div>
      <div class="goal"><strong>Il tuo obiettivo</strong><p>Distinguere peso lordo, netto e servito; usare proporzioni, scarti e resa per calcolare il costo di una porzione e il food cost.</p><ol><li>Modifica la ricetta.</li><li>Stima, poi verifica.</li><li>Risolvi la sfida e motiva.</li></ol></div>
    </div>
    <nav id="recipes" class="recipes" aria-label="Scegli una delle tre ricette"></nav>
    <div class="workspace" id="laboratorio">
      <section class="sheet" aria-labelledby="recipe-title">
        <div class="sheet-title"><div><h2 id="recipe-title"></h2><p class="muted small" id="recipe-description"></p></div><span class="tag">Dati fittizi · tutto modificabile</span></div>
        <form id="recipe-form" novalidate>
          <div class="settings">
            <div class="field"><label for="portions">Numero di porzioni</label><div class="input-unit"><input id="portions" type="number" min="1" max="100" step="1" required data-setting="portions" aria-describedby="portions-help"><span>porzioni</span></div><p class="field-help" id="portions-help">Da 1 a 100, solo numeri interi.</p></div>
            <div class="field"><label for="sale">Prezzo di vendita per porzione</label><div class="input-unit"><input id="sale" type="number" min="0.01" max="100" step="0.01" required data-setting="sale" aria-describedby="sale-help"><span>€</span></div><p class="field-help" id="sale-help">Serve per il food cost percentuale.</p></div>
          </div>
          <div class="ingredient-head"><h3>La tua scheda ingredienti</h3><a href="#model-details" class="small">Come leggere i pesi</a></div>
          <p class="legend"><strong>Grammatura = peso servito per porzione.</strong> La resa è il rapporto tra peso dopo e prima della cottura: 250% = il peso diventa 2,5 volte quello iniziale. Lo scarto si applica al peso lordo acquistato.</p>
          <div id="ingredients"></div>
          <div class="estimate" id="estimate-area">
            <h3>Prima i ragionamenti, poi i conti.</h3><p class="small muted">La ricetta è già pronta. Puoi usarla così o modificarla. Prima di svelare i risultati, stima il costo degli ingredienti di <strong>una porzione</strong>.</p>
            <div class="estimate-grid">
              <div class="field"><label for="estimate">La tua stima</label><div class="input-unit"><input id="estimate" type="number" min="0.01" max="10000" step="0.01" required aria-describedby="estimate-help"><span>€/porzione</span></div><p class="field-help" id="estimate-help">Una previsione, non un voto.</p></div>
              <div class="field"><label for="reasoning">Come hai ragionato? <span class="muted">(facoltativo)</span></label><textarea id="reasoning" maxlength="2000" placeholder="Quale ingrediente pesa di più sul costo? Come consideri scarti e resa?" aria-describedby="reasoning-help"></textarea><p class="field-help" id="reasoning-help">Autovalutazione: cita almeno un dato, un'operazione e un'ipotesi. Il testo non viene valutato automaticamente.</p></div>
            </div>
            <button class="primary" type="submit">Confronta la stima e calcola</button>
          </div>
          <div id="validation" class="feedback error" role="alert" hidden></div>
        </form>
        <div id="prediction-feedback" class="feedback" role="status" hidden></div>
        <section id="results" class="results" aria-labelledby="results-title" hidden>
          <div class="results-header"><h2 id="results-title">I conti della tua ricetta</h2><span class="live-label">Si aggiornano quando modifichi i dati</span></div>
          <div id="metrics" class="metrics mono" aria-live="polite" aria-atomic="true"></div>
          <div class="table-scroll" role="region" aria-label="Quantità e costi: scorri orizzontalmente se necessario" tabindex="0"><table><caption>Quantità per tutte le porzioni. I conti usano valori non arrotondati.</caption><thead><tr><th scope="col">Ingrediente</th><th scope="col">Servito · g</th><th scope="col">Netto crudo · g</th><th scope="col">Lordo · g</th><th scope="col">Costo · €</th></tr></thead><tbody id="calculation-rows"></tbody><tfoot id="calculation-total"></tfoot></table></div>
          <div class="formula"><h3>Il percorso dal piatto alla spesa</h3><ol><li><strong>Servito totale</strong> = grammatura per porzione × numero di porzioni.</li><li><strong>Netto crudo</strong> = servito totale ÷ (resa ÷ 100).</li><li><strong>Lordo da acquistare</strong> = netto crudo ÷ (1 − scarto ÷ 100).</li><li><strong>Costo ingrediente</strong> = lordo in grammi ÷ 1.000 × prezzo al kg.</li></ol></div>
          <details class="formula"><summary>Un passaggio con i tuoi numeri</summary><div id="worked-calculation"></div><p>Costo per porzione = somma dei costi ÷ porzioni.<br>Food cost % = costo per porzione ÷ prezzo di vendita × 100.</p></details>
          <div id="challenge-feedback" class="feedback" role="status"></div>
          <div class="actions"><button id="new-estimate" class="secondary" type="button">Fai una nuova stima</button></div>
          <p class="field-help">Per esercitarti di nuovo, nascondi i risultati prima di cambiare i dati.</p>
        </section>
      </section>
      <aside aria-label="Sfida e supporti">
        <section class="challenge" aria-labelledby="challenge-title"><h2 id="challenge-title">La sfida del menu</h2><p class="muted">Rispetta il costo massimo per porzione, senza perdere l'identità del piatto.</p><div class="budget mono" id="budget"></div><p class="muted">di ingredienti, per porzione</p><hr><h3>I vincoli</h3><ul id="constraints"></ul><p class="muted small">Puoi sperimentare con tutti i parametri. Per superare la sfida, mantieni scarti e rese iniziali e non ridurre i prezzi di listino di oltre il 10%.</p><button id="hint-button" type="button">Un primo suggerimento</button><div id="hints" class="hint" aria-live="polite"></div></section>
        <details class="model-note" id="model-details"><summary>Pesi, resa e limiti del modello</summary><div id="model-copy"></div></details>
        <details class="model-note"><summary>Un esempio già svolto</summary><div id="example-copy"></div></details>
      </aside>
    </div>
    <div class="finish"><p>Hai trovato un equilibrio? Concludi anche se la sfida non è ancora risolta: il riepilogo conserva le ricette calcolate e le tue scelte.</p><button id="finish-button" class="primary" type="button">Riepilogo e riflessione</button></div>
    <div id="finish-error" class="feedback error" role="alert" hidden></div>
    <section class="summary-section sheet" id="summary" tabindex="-1" aria-labelledby="summary-title" hidden>
      <h2 id="summary-title">Le tue scelte, messe a fuoco.</h2><p class="muted">Una fotografia delle ricette calcolate. Se torni a modificare i dati, genera di nuovo il riepilogo.</p><div id="summary-recipes"></div>
      <h3 style="margin-top:28px">Tre domande per riflettere</h3><div id="reflections" class="reflections"></div>
      <fieldset class="self-check"><legend>Criteri di autovalutazione delle risposte aperte</legend><div id="self-checks"></div></fieldset>
      <p class="closing">Le caselle ti aiutano a rileggere il tuo lavoro: non producono voti o giudizi automatici. Non inserire nomi o altri dati personali. Nulla viene inviato o salvato: chiudendo o ricaricando la pagina perdi il lavoro.</p>
      <div class="actions"><button id="restart" class="primary" type="button">Ricomincia il laboratorio</button><span class="small muted">Ripristina tutte e tre le ricette e cancella le risposte.</span></div>
    </section>
  </main>
  <footer><span>IPSEOA · Cucina / Matematica</span><span>Dati simulati per imparare, non preventivi professionali.</span></footer>
</template>
<script>
"use strict";
const DIDATTICA = {
  modello: [
    "Lordo: peso acquistato, prima della pulizia. Netto crudo: parte utilizzabile dopo la pulizia e prima della cottura. Servito: peso finale nel piatto. Lo scarto non è la perdita in cottura: quest'ultima è già nella resa.",
    "Resa = peso servito ÷ netto crudo × 100. Può superare il 100% se l'ingrediente assorbe acqua; può essere inferiore al 100% se perde acqua. Non è un secondo scarto da sottrarre al lordo.",
    "Modello semplificato: prezzi e rese fittizi e costanti; ogni ingrediente è acquistato a peso, anche l'olio. Acqua, sale, energia, lavoro, IVA, imballaggi, confezioni intere e variazioni stagionali sono esclusi. Il costo cresce in proporzione alle porzioni, senza economie di scala.",
    "Il food cost considera solo gli ingredienti rispetto al prezzo di vendita. La differenza non è l'utile. Anche un food cost basso non dimostra che un piatto sia equilibrato, nutriente o conveniente."
  ],
  esempio: "Per servire 150 g di una verdura con resa 75% e scarto 20%: netto crudo = 150 ÷ 0,75 = 200 g; lordo = 200 ÷ 0,80 = 250 g. A 4 €/kg spendi 250 ÷ 1.000 × 4 = 1 € per porzione. A un prezzo di vendita di 8 €, il food cost è 1 ÷ 8 × 100 = 12,5%.",
  domande: [
    "Quale scelta ha inciso di più sul costo? Confronta almeno due valori prima e dopo la modifica.",
    "Se raddoppi le porzioni, che cosa succede a lordo, costo totale e costo per porzione? Spiega perché.",
    "Perché aumentare lo scarto fa aumentare il costo, mentre una resa maggiore può ridurlo? Quali limiti del modello conterebbero in cucina?"
  ],
  criteri: [
    "Ho usato dati e unità di misura per motivare almeno una scelta.",
    "Ho distinto lordo, netto crudo e servito, spiegando scarto e resa.",
    "Ho collegato costo per porzione e prezzo di vendita al food cost, citando un limite del modello."
  ],
  etichette: {
    grammi:"Servito g/pz", prezzo:"Prezzo €/kg", scarto:"Scarto %", resa:"Resa %",
    opzionale:"Facoltativo", minimo:"Obbligatorio · min.",
    costoTotale:"Costo totale", costoPorzione:"Costo / porzione", foodCost:"Food cost", lordo:"Da acquistare",
    hintButtons:["Un primo suggerimento","Un altro indizio","L'ultimo suggerimento","Suggerimenti completati"],
    current:"In lavorazione", calculated:"Calcolata", ready:"Ricetta pronta",
    errTitle:"Controlla i dati prima di continuare.",
    invalidNumber:"Inserisci un numero nel campo indicato, rispettando l'intervallo e il passo. I risultati torneranno visibili quando i dati saranno validi.",

    success:"Sfida riuscita.", retry:"Sfida ancora aperta: puoi riprovare.",
    noIngredients:"La ricetta non contiene ingredienti: il costo è zero, ma non c'è un piatto da servire.",
    predictionTitle:"La tua previsione, alla prima verifica",
    precise:"La differenza è entro il 10%. Quali ipotesi hanno funzionato?",
    under:"Hai sottostimato. Controlla se hai incluso tutti gli ingredienti e il lordo da acquistare: netto e lordo non coincidono in presenza di scarti.",
    over:"Hai sovrastimato. Controlla la conversione da grammi a kg e la resa: un ingrediente che assorbe acqua richiede meno peso crudo del peso servito.",
    same:"La stima coincide con il risultato arrotondato. Confronta comunque il procedimento, non solo il numero.",
    predictionDetail:(estimate,actual,difference)=>`Stima: ${estimate} / porzione. Calcolo di allora: ${actual} / porzione. Differenza assoluta: ${difference}. Il confronto resta riferito a quella previsione; i conti sotto seguono le modifiche.`,
    constraints:(name,min)=>`${name}: almeno ${min} g serviti per porzione.`,
    priceConstraint:"Prezzi: almeno il 90% del listino iniziale (riportato sotto ogni ingrediente).",
    yieldConstraint:"Scarti e rese: uguali ai valori iniziali, riportati sotto ogni ingrediente.",
    noPersonal:"Motivazione non inserita: puoi discuterla a voce usando i criteri di autovalutazione.",
    budgetError:(amount,budget)=>`Superi il budget di ${amount} per porzione (massimo ${budget}). Riduci una grammatura, rispettando i minimi, o confronta i prezzi consentiti.`,
    minError:(name,min)=>`${name}: servono almeno ${min} g serviti per porzione. Ripristina la quantità minima per mantenere l'identità del piatto.`,
    priceError:(name,min)=>`${name}: il prezzo è sotto il minimo realistico della sfida (${min}/kg). Non puoi risolvere il budget azzerando il prezzo.`,
    processingError:(name,waste,yieldValue)=>`${name}: per la sfida usa scarto ${waste}% e resa ${yieldValue}%. Un cambio di processo richiederebbe una verifica reale in cucina.`,
    successDetail:(margin)=>`Ingredienti obbligatori e condizioni rispettati. Margine sul budget: ${margin} per porzione. Ora spiega il compromesso tra costo e quantità.`,
    recipeCount:(count)=>`${count} ricetta/e calcolata/e su 3. Le altre non sono incluse nel riepilogo.`,
    invalidField:(name)=>`Campo da correggere: ${name}.`
  },
  ricette: [
    {id:"risotto",nome:"Risotto alle zucchine",breve:"Riso, verdure e mantecatura",descrizione:"Il riso assorbe acqua, le zucchine ne perdono: due rese diverse nello stesso piatto.",porzioni:10,vendita:8.50,budget:0.60,
      ingredienti:[
        {nome:"Riso",grammi:180,prezzo:2.80,scarto:0,resa:250,minimo:160},
        {nome:"Zucchine",grammi:70,prezzo:2.40,scarto:10,resa:80,minimo:60},
        {nome:"Grana",grammi:10,prezzo:16,scarto:0,resa:100,minimo:8},
        {nome:"Olio",grammi:6,prezzo:9,scarto:0,resa:100,minimo:0},
        {nome:"Cipolla",grammi:10,prezzo:1.50,scarto:12,resa:80,minimo:0}
      ],
      suggerimenti:["Quale ingrediente costa di più per porzione? Il prezzo al kg da solo non basta: considera quanto ne acquisti.","Per il riso, 180 g nel piatto non sono 180 g da acquistare. Per le zucchine, risali dal servito al crudo e poi al lordo.","Prova a ridurre le grammature degli ingredienti più costosi senza scendere sotto i minimi. Cambia un solo valore alla volta e confronta il risparmio."],
      soluzioneDocente:{grammi:[160,60,8,5,8],prezzi:"listino iniziale",costoAtteso:0.5692454545}
    },
    {id:"pasta",nome:"Pasta al pomodoro",breve:"Un classico, tante proporzioni",descrizione:"La pasta aumenta di peso in cottura; la salsa si concentra. Quanto compri davvero?",porzioni:10,vendita:7,budget:0.65,
      ingredienti:[
        {nome:"Pasta secca",grammi:200,prezzo:1.80,scarto:0,resa:240,minimo:180},
        {nome:"Pomodori",grammi:90,prezzo:2.20,scarto:8,resa:75,minimo:80},
        {nome:"Grana",grammi:8,prezzo:16,scarto:0,resa:100,minimo:5},
        {nome:"Olio",grammi:7,prezzo:9,scarto:0,resa:100,minimo:0},
        {nome:"Basilico",grammi:2,prezzo:18,scarto:20,resa:100,minimo:0}
      ],
      suggerimenti:["Confronta il costo della salsa con quello della pasta. Il maggior peso nel piatto non implica il maggior costo.","Per i pomodori ci sono due passaggi: resa del 75% e parte utilizzabile del 92%. In quale ordine li usi per risalire al lordo?","Esplora una piccola riduzione del grana e della salsa, entro i minimi. Il basilico è facoltativo nel modello: eliminarlo cambia anche l'identità percepita del piatto?"],
      soluzioneDocente:{grammi:[180,80,5,6,1],prezzi:"listino iniziale",costoAtteso:0.5465724638}
    },
    {id:"pollo",nome:"Pollo con patate",breve:"Il peso della cottura",descrizione:"Un secondo con contorno: scarti di pulizia e perdita d'acqua hanno un costo.",porzioni:10,vendita:11,budget:2.10,
      ingredienti:[
        {nome:"Pollo disossato",grammi:150,prezzo:8,scarto:5,resa:75,minimo:130},
        {nome:"Patate",grammi:160,prezzo:1.50,scarto:18,resa:85,minimo:140},
        {nome:"Olio",grammi:8,prezzo:9,scarto:0,resa:100,minimo:0},
        {nome:"Limone",grammi:10,prezzo:2.80,scarto:35,resa:100,minimo:0}
      ],
      suggerimenti:["Individua l'ingrediente che assorbe la maggior parte del budget. Ha senso iniziare da una voce che costa pochi centesimi?","Il pollo servito pesa meno del pollo crudo pulito. Per risalire al netto crudo, devi dividere per 0,75 o moltiplicare?","Prova a portare la carne verso il minimo consentito, poi verifica il contorno. Non cambiare contemporaneamente tutti i parametri: il confronto deve spiegare il risparmio."],
      soluzioneDocente:{grammi:[130,140,6,8],prezzi:"listino iniziale",costoAtteso:1.8494019095}

};

</script>
<script>
"use strict";
const $ = id => document.getElementById(id);
document.body.append($("interfaccia-docente").content.cloneNode(true));
const T = DIDATTICA.etichette;
const euro = value => new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR"}).format(value);
const num = (value,digits=1) => new Intl.NumberFormat("it-IT",{maximumFractionDigits:digits}).format(value);
const escapeHTML = value => String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fresh = recipe => ({portions:recipe.porzioni,sale:recipe.vendita,ingredients:recipe.ingredienti.map(i=>({...i})),estimate:"",reasoning:"",revealed:false,prediction:null,hints:0});
let drafts = DIDATTICA.ricette.map(fresh), selected=0;
const recipe = () => DIDATTICA.ricette[selected];
const draft = () => drafts[selected];

function calculate(data){
  const rows=data.ingredients.map(i=>{
    const served=i.grammi*data.portions,net=served/(i.resa/100),gross=net/(1-i.scarto/100);
    return {...i,served,net,gross,cost:gross/1000*i.prezzo};
  });
  const total=rows.reduce((s,i)=>s+i.cost,0),perPortion=total/data.portions;
  return {rows,total,perPortion,foodCost:perPortion/data.sale*100,gross:rows.reduce((s,i)=>s+i.gross,0)};
}
function challengeErrors(data,r,result){
  const errors=[];
  if(result.perPortion>r.budget+1e-9)errors.push(T.budgetError(euro(result.perPortion-r.budget),euro(r.budget)));
  data.ingredients.forEach((i,index)=>{
    const base=r.ingredienti[index];
    if(i.grammi<base.minimo)errors.push(T.minError(i.nome,num(base.minimo)));
    if(i.grammi>0 && i.prezzo+1e-9<base.prezzo*.9)errors.push(T.priceError(i.nome,euro(base.prezzo*.9)));
    if(i.grammi>0 && (i.scarto!==base.scarto || i.resa!==base.resa))errors.push(T.processingError(i.nome,num(base.scarto),num(base.resa)));
  });
  return errors;
}
function validData(data){
  const range=(v,min,max)=>Number.isFinite(v)&&v>=min&&v<=max;
  const step=(v,multiple)=>Math.abs(v*multiple-Math.round(v*multiple))<1e-8;
  return range(data.portions,1,100)&&Number.isInteger(data.portions)&&range(data.sale,.01,100)&&step(data.sale,100)&&
    data.ingredients.every(i=>range(i.grammi,0,1000)&&step(i.grammi,10)&&range(i.prezzo,.01,1000)&&step(i.prezzo,100)&&range(i.scarto,0,95)&&step(i.scarto,10)&&range(i.resa,1,400)&&step(i.resa,10));
}
function invalidateSummary(){ $("summary").hidden=true; $("finish-error").hidden=true; }
function renderNav(){
  $("recipes").innerHTML=DIDATTICA.ricette.map((r,i)=>`<button type="button" data-recipe="${i}" aria-pressed="${i===selected}" aria-controls="laboratorio">${escapeHTML(r.nome)}<span>${i===selected?T.current:drafts[i].revealed?T.calculated:T.ready}</span></button>`).join("");
}
function renderEditor(){
  const r=recipe(),d=draft();
  renderNav();
  $("recipe-title").textContent=r.nome;$("recipe-description").textContent=r.descrizione;
  $("portions").value=d.portions;$("sale").value=d.sale;
  $("estimate").value=d.estimate;$("reasoning").value=d.reasoning;
  $("estimate").required=!d.revealed;$("estimate-area").hidden=d.revealed;
  $("ingredients").innerHTML=d.ingredients.map((i,n)=>{
    const base=r.ingredienti[n];
    return `<div class="ingredient"><div class="ingredient-name">${escapeHTML(i.nome)}<small>${i.minimo?`${T.minimo} ${num(i.minimo)} g`:T.opzionale}</small><small id="base-${n}">Listino ${euro(base.prezzo)}/kg<br>Scarto ${num(base.scarto)}% · resa ${num(base.resa)}%</small></div>${[
      ["grammi",T.grammi,0,1000,.1],["prezzo",T.prezzo,.01,1000,.01],["scarto",T.scarto,0,95,.1],["resa",T.resa,1,400,.1]
    ].map(([key,label,min,max,step])=>`<div><label for="i-${n}-${key}">${label}</label><input id="i-${n}-${key}" aria-label="${escapeHTML(i.nome)}: ${label}" aria-describedby="base-${n}" type="number" min="${min}" max="${max}" step="${step}" required data-index="${n}" data-key="${key}" value="${Number.isFinite(i[key])?i[key]:""}"></div>`).join("")}</div>`;
  }).join("");
  $("budget").textContent=euro(r.budget);
  $("constraints").innerHTML=r.ingredienti.filter(i=>i.minimo).map(i=>`<li>${escapeHTML(T.constraints(i.nome,num(i.minimo)))}</li>`).join("")+`<li>${T.priceConstraint}</li><li>${T.yieldConstraint}</li>`;
  renderHints();$("validation").hidden=true;
  document.querySelectorAll("[aria-invalid]").forEach(i=>i.removeAttribute("aria-invalid"));
  renderPrediction();
  if(d.revealed)validateAndRender(false);else $("results").hidden=true;
}
function renderHints(){
  $("hints").innerHTML=recipe().suggerimenti.slice(0,draft().hints).map((h,i)=>`<p><strong>Indizio ${i+1}.</strong> ${escapeHTML(h)}</p>`).join("");
  $("hint-button").textContent=T.hintButtons[draft().hints];
  $("hint-button").disabled=draft().hints>=recipe().suggerimenti.length;
}
function renderPrediction(){
  const p=draft().prediction;$("prediction-feedback").hidden=!p||!draft().revealed;
  if(!p)return;
  const diff=Math.abs(p.estimate-p.actual),relative=p.actual?diff/p.actual:Infinity;
  const feedback=Math.round(p.estimate*100)===Math.round(p.actual*100)?T.same:relative<=.1?T.precise:p.estimate<p.actual?T.under:T.over;
  $("prediction-feedback").innerHTML=`<strong>${T.predictionTitle}</strong><p>${escapeHTML(T.predictionDetail(euro(p.estimate),euro(p.actual),euro(diff)))}</p><p>${feedback}</p>`;
}
function validateAndRender(focus){
  const inputs=[...$("recipe-form").querySelectorAll("input")].filter(i=>i.required);
  const invalid=inputs.filter(i=>!i.checkValidity());
  inputs.forEach(i=>{if(invalid.includes(i))i.setAttribute("aria-invalid","true");else i.removeAttribute("aria-invalid");});
  $("validation").hidden=!invalid.length;
  if(invalid.length){
    const first=invalid[0];
    $("validation").textContent=`${T.errTitle} ${T.invalidField(first.getAttribute("aria-label")||document.querySelector(`label[for="${first.id}"]`).textContent)} ${T.invalidRange(num(Number(first.min),2),num(Number(first.max),2),num(Number(first.step),2))} ${T.invalidNumber}`;
    $("results").hidden=true;$("prediction-feedback").hidden=true;
    if(focus){invalid[0].focus();invalid[0].reportValidity();}
    return false;
  }
  if(draft().revealed){renderResults();renderPrediction();}
  return true;
}
function renderResults(){
  const d=draft(),r=recipe(),c=calculate(d),errors=challengeErrors(d,r,c);
  $("results").hidden=false;
  $("metrics").innerHTML=[[T.costoTotale,euro(c.total)],[T.costoPorzione,euro(c.perPortion)],[T.foodCost,`${num(c.foodCost,2)}%`],[T.lordo,`${num(c.gross/1000,3)} kg`]].map(([label,value],i)=>`<div class="metric ${i===1?"featured":""}"><span>${label}</span><strong>${value}</strong></div>`).join("");
  $("calculation-rows").innerHTML=c.rows.map(i=>`<tr><th scope="row">${escapeHTML(i.nome)}</th><td>${num(i.served)}</td><td>${num(i.net)}</td><td>${num(i.gross)}</td><td>${num(i.cost,2)}</td></tr>`).join("");
  $("calculation-total").innerHTML=`<tr><th scope="row">Totale</th><td>${num(c.rows.reduce((s,i)=>s+i.served,0))}</td><td>${num(c.rows.reduce((s,i)=>s+i.net,0))}</td><td>${num(c.gross)}</td><td>${num(c.total,2)}</td></tr>`;
  const i=c.rows.find(i=>i.grammi>0)||c.rows[0];
  $("worked-calculation").innerHTML=`<p><strong>${escapeHTML(i.nome)}</strong> · ${num(d.portions)} porzioni</p><ol><li>Servito: ${num(i.grammi)} × ${num(d.portions)} = <strong>${num(i.served,2)} g</strong>.</li><li>Netto crudo: ${num(i.served,2)} ÷ ${num(i.resa/100,3)} = <strong>${num(i.net,2)} g</strong>.</li><li>Lordo: ${num(i.net,2)} ÷ ${num(1-i.scarto/100,3)} = <strong>${num(i.gross,2)} g</strong>.</li><li>Costo: ${num(i.gross,2)} ÷ 1.000 × ${num(i.prezzo,2)} = <strong>${euro(i.cost)}</strong>.</li></ol><p>Per la ricetta: ${euro(c.total)} ÷ ${num(d.portions)} = ${euro(c.perPortion)} / porzione; ${euro(c.perPortion)} ÷ ${euro(d.sale)} × 100 ≈ ${num(c.foodCost,2)}%. Gli importi mostrati sono arrotondati.</p>`;
  $("challenge-feedback").className=`feedback ${errors.length?"error":""}`;
  $("challenge-feedback").innerHTML=`<strong>${errors.length?T.retry:T.success}</strong>${errors.length?`<ul>${errors.map(e=>`<li>${escapeHTML(e)}</li>`).join("")}</ul>`:`<p>${escapeHTML(T.successDetail(euro(r.budget-c.perPortion)))}</p>`}${!c.total?`<p>${T.noIngredients}</p>`:""}`;
}

$("recipes").addEventListener("click",event=>{
  const button=event.target.closest("button[data-recipe]");if(!button)return;
  selected=Number(button.dataset.recipe);renderEditor();
  // La navigazione viene ridisegnata: ripristina il focus sul pulsante scelto.
  $("recipes").querySelector(`[data-recipe="${selected}"]`).focus();
});
$("recipe-form").addEventListener("input",event=>{
  const el=event.target,d=draft();
  if(el.dataset.setting)d[el.dataset.setting]=el.valueAsNumber;
  else if(el.dataset.key)d.ingredients[Number(el.dataset.index)][el.dataset.key]=el.valueAsNumber;
  else if(el.id==="estimate")d.estimate=el.value;
  else if(el.id==="reasoning")d.reasoning=el.value;
  invalidateSummary();
  if(d.revealed)validateAndRender(false);
});
$("recipe-form").addEventListener("submit",event=>{
  event.preventDefault();if(draft().revealed)return;
  if(!validateAndRender(true))return;
  const d=draft();d.revealed=true;d.prediction={estimate:Number(d.estimate),actual:calculate(d).perPortion};
  $("estimate-area").hidden=true;$("estimate").required=false;
  renderResults();renderPrediction();renderNav();invalidateSummary();
  $("results-title").setAttribute("tabindex","-1");$("results-title").focus();
});
$("new-estimate").addEventListener("click",()=>{
  const d=draft();d.revealed=false;d.prediction=null;d.estimate="";
  invalidateSummary();renderEditor();$("estimate").focus();
});
$("hint-button").addEventListener("click",()=>{draft().hints=Math.min(draft().hints+1,recipe().suggerimenti.length);renderHints();});
$("finish-button").addEventListener("click",()=>{
  const completed=drafts.map((d,i)=>({d,r:DIDATTICA.ricette[i]})).filter(({d})=>d.revealed);
  const invalid=completed.filter(({d})=>!validData(d));
  if(!completed.length||invalid.length){
    $("finish-error").textContent=invalid.length?`${T.invalidSummary} ${invalid.map(({r})=>r.nome).join(", ")}.`:T.noSummary;
    $("finish-error").hidden=false;return;
  }
  $("finish-error").hidden=true;
  $("summary-recipes").innerHTML=`<p class="small muted">${T.recipeCount(completed.length)}</p>`+completed.map(({d,r})=>{
    const c=calculate(d),base=calculate(fresh(r)),errors=challengeErrors(d,r,c);
    return `<article class="summary-recipe"><h3>${escapeHTML(r.nome)}</h3><p>${num(d.portions)} porzioni · vendita ${euro(d.sale)} / porzione · budget ${euro(r.budget)} / porzione.<br><strong>Totale ${euro(c.total)} · ${euro(c.perPortion)} / porzione · food cost ${num(c.foodCost,2)}%</strong><br>Costo iniziale a listino: ${euro(base.perPortion)} / porzione. Variazione: ${euro(c.perPortion-base.perPortion)} / porzione.<br>Ultima stima: ${euro(d.prediction.estimate)} / porzione; alla verifica: ${euro(d.prediction.actual)} / porzione.</p><ul>${d.ingredients.map((i,n)=>`<li><strong>${escapeHTML(i.nome)}</strong>: ${num(r.ingredienti[n].grammi)} → ${num(i.grammi)} g serviti / porzione; ${euro(i.prezzo)}/kg; scarto ${num(i.scarto)}%; resa ${num(i.resa)}%. Lordo totale: ${num(c.rows[n].gross)} g; costo: ${euro(c.rows[n].cost)}.</li>`).join("")}</ul><p><strong>${errors.length?T.retry:T.success}</strong></p>${errors.length?`<ul>${errors.map(e=>`<li>${escapeHTML(e)}</li>`).join("")}</ul>`:""}<p><strong>Il tuo ragionamento:</strong> ${d.reasoning.trim()?escapeHTML(d.reasoning).replace(/\n/g,"<br>"):T.noPersonal}</p></article>`;
  }).join("");
  $("summary").hidden=false;$("summary").focus();
});
$("restart").addEventListener("click",()=>{
  drafts=DIDATTICA.ricette.map(fresh);selected=0;
  document.querySelectorAll("#reflections textarea").forEach(el=>el.value="");
  document.querySelectorAll("#self-checks input").forEach(el=>el.checked=false);
  invalidateSummary();renderEditor();$("recipes").querySelector("button").focus();
});
$("model-copy").innerHTML=DIDATTICA.modello.map(p=>`<p>${escapeHTML(p)}</p>`).join("");
$("example-copy").textContent=DIDATTICA.esempio;
$("reflections").innerHTML=DIDATTICA.domande.map((q,i)=>`<div class="field"><label for="reflection-${i}">${i+1}. ${escapeHTML(q)}</label><textarea id="reflection-${i}" maxlength="3000" aria-describedby="self-checks"></textarea></div>`).join("");
$("self-checks").innerHTML=DIDATTICA.criteri.map((c,i)=>`<label for="check-${i}"><input id="check-${i}" type="checkbox">${escapeHTML(c)}</label>`).join("");

// Autoverifica facoltativa: eseguire selfCheck() nella console del browser.
// Dopo una personalizzazione, aggiornare anche le soluzioniDocente di riferimento.
function selfCheck(){
  const assert=(condition,message)=>{if(!condition)throw new Error(`Autoverifica: ${message}`);};
  const close=(a,b)=>Math.abs(a-b)<1e-8;
  const sample={portions:1,sale:8,ingredients:[{nome:"Esempio",grammi:150,prezzo:4,scarto:20,resa:75,minimo:0}]};
  const c=calculate(sample);
  assert(close(c.rows[0].net,200)&&close(c.rows[0].gross,250)&&close(c.total,1)&&close(c.foodCost,12.5),"lordo, netto, resa e food cost");
  const double=calculate({...sample,portions:2});
  assert(close(double.total,2*c.total)&&close(double.perPortion,c.perPortion),"proporzionalità delle porzioni");
  assert(calculate({...sample,ingredients:[{...sample.ingredients[0],scarto:30}]}).total>c.total,"effetto dello scarto");
  assert(calculate({...sample,ingredients:[{...sample.ingredients[0],resa:100}]}).total<c.total,"effetto della resa");
  assert(!validData({...sample,portions:0})&&!validData({...sample,sale:NaN}),"dati non validi");
  assert(!validData({...sample,ingredients:[{...sample.ingredients[0],scarto:100}]}),"scarto del 100% non ammesso");
  DIDATTICA.ricette.forEach(r=>{
    const d=fresh(r);assert(validData(d),`${r.id}: dati iniziali`);
    d.ingredients.forEach((i,n)=>i.grammi=r.soluzioneDocente.grammi[n]);
    const solved=calculate(d);assert(!challengeErrors(d,r,solved).length,`${r.id}: sfida risolvibile`);
    assert(Math.abs(solved.perPortion-r.soluzioneDocente.costoAtteso)<.001,`${r.id}: costo soluzione`);
    const required=d.ingredients.find(i=>i.minimo>0),original=required.grammi;
    required.grammi=0;assert(challengeErrors(d,r,calculate(d)).length>0,`${r.id}: vincolo ingrediente obbligatorio`);required.grammi=original;
    required.prezzo=0.01;assert(challengeErrors(d,r,calculate(d)).length>0,`${r.id}: vincolo listino`);
  });
  return "Autoverifica superata: formule, proporzioni, validazione e tre sfide.";
}
renderEditor();
</script>
